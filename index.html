<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCIC 월간 소식</title>
<meta name="description" content="사랑의교회 SCIC 동문회의 전체 행사 소식과 선교 그룹 소식을 달마다 모아 둔 소식지입니다.">
<meta property="og:title" content="SCIC 월간 소식">
<meta property="og:description" content="전체 행사 소식 · 선교 그룹 소식을 달마다 모아 전합니다">
<meta property="og:type" content="website">
<meta property="og:image" content="https://eunseo9311.github.io/scic-news/og.png">
<meta property="og:url" content="https://eunseo9311.github.io/scic-news/">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d4506f'/><text x='32' y='43' text-anchor='middle' font-family='Arial' font-weight='900' font-size='26' fill='white'>SC</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --ink: #2c2f45;
    --soft: #676b82;
    --faint: #9a9db0;
    --line: #e9e6ee;
    --bg: #faf8f6;
    --card: #ffffff;

    /* 로고의 빨강·남색을 한 단계 밝고 부드럽게 */
    --rose: #d4506f;  --rose-d: #b4415f;  --rose-m: #f2c3cf;  --rose-l: #fcf0f3;
    --peri: #5b67b3;  --peri-d: #4a559c;  --peri-m: #cdd2ef;  --peri-l: #f0f2fb;
    --sand: #f6efe6;

    --serif: "Noto Serif KR", "AppleMyungjo", serif;
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
  }
  [hidden] { display: none !important; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .narrow { max-width: 760px; }

  /* 머리 */
  header.top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .top .wrap { display: flex; align-items: center; gap: 18px; min-height: 68px; }
  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; flex: none; }
  .logo img { height: 30px; width: auto; }
  .logo span { font-size: .8rem; font-weight: 700; color: var(--rose-d); border-left: 1px solid var(--line); padding-left: 12px; letter-spacing: .02em; }
  nav.menu { display: flex; gap: 4px; margin-left: auto; }
  nav.menu a {
    text-decoration: none; padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: .94rem; color: var(--soft); white-space: nowrap;
  }
  nav.menu a:hover { color: var(--ink); background: var(--bg); }
  nav.menu a.on { color: var(--rose-d); background: var(--rose-l); }
  @media (max-width: 760px) {
    .top .wrap { flex-wrap: wrap; gap: 0; padding-top: 10px; }
    .logo img { height: 26px; }
    nav.menu { width: calc(100% + 40px); margin: 6px -20px 0; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
    nav.menu::-webkit-scrollbar { display: none; }
  }

  /* 이달의 소식 머리 */
  .mast {
    background:
      radial-gradient(70% 90% at 0% 0%, #fdeef2 0%, transparent 60%),
      radial-gradient(60% 80% at 100% 0%, #eef0fb 0%, transparent 65%),
      #fffdfb;
    border-bottom: 1px solid var(--line);
  }
  .mast .wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; padding-top: 44px; padding-bottom: 44px; }
  .eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .14em; color: var(--rose); text-transform: uppercase; }
  .mast h1 { font-family: var(--serif); font-size: 2.6rem; line-height: 1.2; margin: 10px 0 6px; font-weight: 700; }
  .mast .headline { font-family: var(--serif); font-size: 1.25rem; color: var(--peri-d); margin: 0 0 14px; }
  .mast .intro { color: var(--soft); margin: 0 0 22px; white-space: pre-wrap; }
  .mast .cover { aspect-ratio: 4/3; border-radius: 22px; overflow: hidden; background: var(--sand); box-shadow: 0 24px 50px -30px #5b67b380; }
  .mast .cover img { width: 100%; height: 100%; object-fit: cover; }
  .issue-nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .issue-nav a, .issue-nav span { font-size: .88rem; color: var(--soft); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
  .issue-nav span { opacity: .45; }
  @media (max-width: 760px) {
    .mast .wrap { grid-template-columns: 1fr; gap: 22px; padding-top: 26px; padding-bottom: 28px; }
    .mast h1 { font-size: 2rem; }
    .mast .cover { order: -1; }
  }

  /* 나누기 단추 */
  .share { display: flex; flex-wrap: wrap; gap: 8px; }
  .sbtn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: .92rem; text-decoration: none; color: var(--ink);
  }
  .sbtn svg { width: 20px; height: 20px; flex: none; }
  .sbtn.kakao { background: #fee500; border-color: #fee500; color: #191600; }
  .sbtn.mail { color: var(--peri-d); border-color: var(--peri-m); }
  .sbtn:active { transform: scale(.97); }

  /* 구역 */
  section.block { padding: 46px 0 8px; }
  .block-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
  .block-head h2 { margin: 0; font-family: var(--serif); font-size: 1.55rem; display: flex; align-items: center; gap: 12px; }
  .block-head h2 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
  .block-head small { color: var(--soft); font-size: .88rem; }
  .block-head a { color: var(--soft); font-size: .9rem; text-decoration: none; white-space: nowrap; }
  .c-event { --c: var(--rose); --cd: var(--rose-d); --cl: var(--rose-l); --cm: var(--rose-m); }
  .c-group { --c: var(--peri); --cd: var(--peri-d); --cl: var(--peri-l); --cm: var(--peri-m); }

  /* 소식 카드 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .grid.two { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 560px) { .grid, .grid.two { grid-template-columns: 1fr; gap: 18px; } }
  .card { display: flex; flex-direction: column; text-decoration: none; background: var(--card); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 18px 36px -24px #2c2f4560; }
  .card .ph { aspect-ratio: 4/3; background: var(--cl); overflow: hidden; }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .card .ph.none { display: grid; place-items: center; color: var(--cd); font-family: var(--serif); font-size: 1.3rem; opacity: .7; }
  .card .tx { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h3 { margin: 0; font-family: var(--serif); font-size: 1.15rem; line-height: 1.45; }
  .card p { margin: 0; color: var(--soft); font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .when { font-size: .84rem; color: var(--faint); margin-top: auto; padding-top: 6px; }
  .chip { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 3px 11px; border-radius: 999px; background: var(--cl); color: var(--cd); }
  .chip.draft { background: #fff4d6; color: #8a6200; }

  .card.feature { grid-column: span 3; flex-direction: row; }
  .card.feature .ph { flex: 1.25; aspect-ratio: auto; min-height: 320px; }
  .card.feature .tx { flex: 1; padding: 30px 32px; justify-content: center; gap: 10px; }
  .card.feature h3 { font-size: 1.6rem; }
  .card.feature p { -webkit-line-clamp: 4; font-size: 1rem; }
  @media (max-width: 900px) { .card.feature { grid-column: span 2; } }
  @media (max-width: 680px) {
    .card.feature { grid-column: span 1; flex-direction: column; }
    .card.feature .ph { aspect-ratio: 4/3; min-height: 0; }
    .card.feature .tx { padding: 18px 18px 22px; }
    .card.feature h3 { font-size: 1.3rem; }
  }

  .empty { text-align: center; color: var(--soft); padding: 42px 16px; background: #fff; border-radius: var(--r); border: 1px dashed var(--line); }

  /* 페이지 머리 */
  .phead { padding: 38px 0 6px; }
  .phead h1 { margin: 6px 0 6px; font-family: var(--serif); font-size: 2rem; }
  .phead p { margin: 0; color: var(--soft); }
  .month-h { font-family: var(--serif); font-size: 1.2rem; margin: 34px 0 14px; display: flex; align-items: center; gap: 10px; }
  .month-h a { font-family: Pretendard, sans-serif; font-size: .85rem; color: var(--soft); text-decoration: none; margin-left: auto; }

  /* 선교 그룹 */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 24px; }
  .gtile { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 16px; background: #fff; border: 1px solid var(--line); text-decoration: none; }
  .gtile:hover { border-color: var(--peri-m); background: var(--peri-l); }
  .gtile.add { border: 2px dashed var(--peri-m); background: var(--peri-l); color: var(--peri-d); text-align: left; cursor: pointer; }
  .gname { display: flex; gap: 6px; }
  .gname input { flex: 1; min-width: 0; }
  .gname button { flex: none; width: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: #b3261e; font-size: 1.1rem; }
  .gtile b { font-size: 1.02rem; }
  .gtile span { font-size: .84rem; color: var(--soft); }

  /* 보관함 */
  .year { margin-top: 34px; }
  .year h2 { font-family: var(--serif); font-size: 1.5rem; margin: 0 0 14px; }
  .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  @media (max-width: 900px) { .months { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 560px) { .months { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
  .mon { border-radius: 14px; background: #fff; border: 1px solid var(--line); overflow: hidden; text-decoration: none; display: flex; flex-direction: column; }
  .mon .ph { aspect-ratio: 1; background: var(--sand); }
  .mon .ph img { width: 100%; height: 100%; object-fit: cover; }
  .mon .tx { padding: 8px 10px 10px; }
  .mon b { font-size: 1rem; display: block; }
  .mon span { font-size: .76rem; color: var(--soft); display: block; line-height: 1.4; }
  .mon.off { background: transparent; border-style: dashed; color: var(--faint); pointer-events: none; }
  .mon.off .ph { display: none; }
  .mon.off .tx { margin-top: auto; }
  .mon:not(.off):hover { border-color: var(--rose-m); }

  /* 소식 한 편 */
  .crumb { font-size: .88rem; color: var(--soft); padding-top: 28px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .crumb a { text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  article.story h1 { font-family: var(--serif); font-size: 2.15rem; line-height: 1.35; margin: 14px 0 8px; }
  article.story .lead { font-size: 1.12rem; color: var(--soft); margin: 0 0 14px; }
  article.story .by { font-size: .88rem; color: var(--faint); padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  @media (max-width: 560px) { article.story h1 { font-size: 1.6rem; } }
  .w5 { background: var(--cl); border-radius: var(--r); padding: 20px 22px; margin-bottom: 30px; }
  .w5 h2 { margin: 0 0 10px; font-size: .92rem; color: var(--cd); letter-spacing: .04em; }
  .w5 dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  .w5 dt { font-weight: 800; color: var(--cd); white-space: nowrap; }
  .w5 dd { margin: 0; }
  .prose p { margin: 0 0 1.1em; font-size: 1.06rem; line-height: 1.9; }
  .story h2.sub { font-family: var(--serif); font-size: 1.3rem; margin: 40px 0 16px; padding-top: 22px; border-top: 1px solid var(--line); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .gallery.one { grid-template-columns: 1fr; }
  .gallery figure { margin: 0; }
  .gallery button { display: block; width: 100%; padding: 0; border: none; background: var(--sand); border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; }
  .gallery.one button { aspect-ratio: auto; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; }
  .gallery figcaption { font-size: .84rem; color: var(--soft); padding: 6px 2px 0; }
  .video { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 14px; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vlink { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid var(--line); text-decoration: none; margin-bottom: 10px; font-weight: 600; }
  .iv { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 22px; margin-bottom: 16px; }
  .iv-who { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .iv-who b { font-size: 1.1rem; }
  .iv-who span { color: var(--soft); font-size: .9rem; }
  .iv .q { font-weight: 700; color: var(--cd); margin: 14px 0 4px; }
  .iv .q:first-of-type { margin-top: 0; }
  .iv .a { margin: 0; line-height: 1.85; }
  .iv .a::before { content: "“"; font-family: var(--serif); color: var(--cm); font-size: 1.5rem; line-height: 0; vertical-align: -.35em; margin-right: 2px; }
  .share-box { margin: 44px 0 20px; padding: 22px; border-radius: var(--r); background: #fff; border: 1px solid var(--line); }
  .share-box h2 { margin: 0 0 12px; font-size: 1rem; }
  .more { margin: 30px 0 0; }

  /* 사진 크게 보기 */
  .lb { position: fixed; inset: 0; z-index: 50; background: #16172af2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .lb img { max-height: calc(100vh - 150px); max-width: 100%; object-fit: contain; border-radius: 8px; }
  .lb p { color: #fff; margin: 12px 0 0; text-align: center; }
  .lb .x { position: absolute; top: 14px; right: 14px; }
  .lb .pv, .lb .nx { position: absolute; top: 50%; transform: translateY(-50%); }
  .lb .pv { left: 10px; } .lb .nx { right: 10px; }
  .lb button { width: 52px; height: 52px; border-radius: 50%; border: none; background: #ffffff24; color: #fff; font-size: 1.5rem; }

  /* 편집 */
  .ed { padding-top: 30px; padding-bottom: 80px; }
  .ed h1 { font-family: var(--serif); font-size: 1.7rem; margin: 0 0 20px; }
  .fset { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 22px; margin-bottom: 18px; }
  .fset > h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .fset > .hint { margin: 0 0 16px; color: var(--soft); font-size: .88rem; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label, .lab { font-weight: 700; font-size: .92rem; }
  .field label small { font-weight: 500; color: var(--faint); margin-left: 4px; }
  input[type=text], input[type=month], input[type=password], input[type=url], input[type=email], textarea, select {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fff; min-height: 48px;
  }
  textarea { resize: vertical; min-height: 110px; line-height: 1.7; }
  textarea.big { min-height: 260px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--peri); box-shadow: 0 0 0 3px var(--peri-l); }
  .w5-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 640px) { .w5-form { grid-template-columns: 1fr; } }
  .w5-form .field label b { display: inline-block; min-width: 3.3em; color: var(--rose-d); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg label { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; }
  .seg input { accent-color: var(--rose); width: 20px; height: 20px; }
  .seg label:has(input:checked) { border-color: var(--rose); background: var(--rose-l); color: var(--rose-d); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px;
    border-radius: 12px; border: none; background: var(--rose); color: #fff; font-weight: 700; text-decoration: none;
  }
  .btn.peri { background: var(--peri); }
  .btn.line { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.ghost { background: transparent; color: var(--soft); }
  .btn.danger { background: #fff; color: #b3261e; border: 1.5px solid #f0c9c6; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { min-height: 38px; padding: 6px 14px; font-size: .88rem; border-radius: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spacer { flex: 1; }
  .phs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .phs .p { border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
  .phs .p.cover { border-color: var(--rose); box-shadow: 0 0 0 2px var(--rose-l); }
  .phs img { aspect-ratio: 4/3; object-fit: cover; width: 100%; }
  .phs .pc { padding: 8px; display: grid; gap: 6px; }
  .phs .pc input[type=text] { min-height: 38px; padding: 7px 10px; font-size: .88rem; }
  .phs .pc .row { gap: 6px; font-size: .84rem; justify-content: space-between; }
  .phs .pc label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .drop { border: 2px dashed var(--peri-m); border-radius: 14px; padding: 22px; text-align: center; color: var(--peri-d); background: var(--peri-l); cursor: pointer; font-weight: 700; display: block; }
  .drop small { display: block; font-weight: 500; color: var(--soft); margin-top: 4px; }
  .ivf { border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .ivf .qa { display: grid; gap: 6px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .savebar { position: sticky; bottom: 0; background: #fffffff2; backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 10; }
  .savebar .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .adm-list { display: grid; gap: 8px; }
  .adm-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .adm-item img { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; flex: none; background: var(--sand); }
  .adm-item .t { flex: 1; min-width: 0; }
  .adm-item .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adm-item .t span { font-size: .82rem; color: var(--soft); }
  .gnames { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }

  /* 창 */
  .modal { position: fixed; inset: 0; z-index: 40; background: #2c2f4566; display: grid; place-items: center; padding: 16px; }
  .modal .box { background: #fff; border-radius: 22px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; }
  .modal h2 { margin: 0 0 6px; font-family: var(--serif); }
  .modal .hint { color: var(--soft); font-size: .9rem; margin: 0 0 16px; }
  .mail-prev { border: 1px solid var(--line); border-radius: 14px; margin-top: 16px; max-height: 420px; overflow: auto; background: #f4f3f6; padding: 12px; }

  footer.foot { margin-top: 70px; background: #fff; border-top: 1px solid var(--line); padding: 30px 0 44px; font-size: .86rem; color: var(--soft); }
  footer.foot .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
  footer.foot img { height: 22px; opacity: .8; }
  footer.foot a { color: var(--soft); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; opacity: 0; pointer-events: none;
    transition: .25s; z-index: 60; max-width: calc(100% - 32px); text-align: center; font-weight: 600;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .demo-bar { background: #fff4d6; color: #7a5600; text-align: center; font-size: .84rem; padding: 6px 12px; }
  .loading { padding: 80px 0; text-align: center; color: var(--faint); }
</style>
</head>
<body>
<div class="demo-bar" id="demoBar" hidden></div>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/"><img src="logo-scic.png" alt="SCIC SaRang Christian Impact Connect" width="509" height="88"><span>월간 소식</span></a>
    <nav class="menu" id="menu">
      <a href="#/" data-k="home">이달의 소식</a>
      <a href="#/events" data-k="events">전체 행사 소식</a>
      <a href="#/groups" data-k="groups">선교 그룹 소식</a>
      <a href="#/archive" data-k="archive">지난 소식</a>
      <a href="#/admin" data-k="admin" id="admLink" hidden>편집</a>
    </nav>
  </div>
</header>
<main id="app"><div class="loading">불러오는 중…</div></main>
<footer class="foot">
  <div class="wrap">
    <img src="logo-scic.png" alt="SCIC">
    <span>사랑의교회 SCIC 동문회 · 일터에서 의미와 가치를 찾는 사람들</span>
    <span class="spacer"></span>
    <a href="#/admin">편집실</a>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import store, { isDemo, summarize, DEFAULT_GROUPS } from "./store.js";

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SECTIONS = { event: "전체 행사 소식", group: "선교 그룹 소식" };
const W5 = [["who", "누가"], ["when", "언제"], ["where", "어디서"], ["what", "무엇을"], ["how", "어떻게"], ["why", "왜"]];

if (isDemo) {
  const bar = $("#demoBar");
  bar.hidden = false;
  bar.textContent = "체험 모드예요. 이 기기에만 저장되고, 편집실에서 '구글로 로그인'을 누르면 체험 편집자로 들어가요.";
}

/* ── 작은 도구 ── */
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 3200);
}
const fail = (e) => {
  console.error(e);
  if (e?.code === "permission-denied") toast("편집 권한이 없거나 저장할 수 없는 내용이에요.");
  else toast("잠시 연결이 안 돼요. 조금 뒤에 다시 해 주세요.");
};
const issueLabel = (id) => { const [y, m] = id.split("-"); return `${y}년 ${+m}월호`; };
const monthLabel = (id) => { const [y, m] = id.split("-"); return `${y}년 ${+m}월`; };
const thisMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const shiftMonth = (id, n) => { let [y, m] = id.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${String(m).padStart(2, "0")}`; };
const pageUrl = (hash) => location.origin + location.pathname + location.search + hash;
// 로그인한 사람과 역할("admin" | "editor" | ""). 역할은 편집자 명단으로 정합니다.
let me = null;
const isEditor = () => !!me?.role;
const isAdmin = () => me?.role === "admin";
const ROLE = { admin: "관리자", editor: "편집자" };
let authReady;
const firstAuth = new Promise((r) => { authReady = r; });
let started = false;
function josa(word, pair) {
  const w = String(word).trim(); const c = w.charCodeAt(w.length - 1);
  const has = c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 !== 0 : false;
  const [a, b] = pair.split("/");
  return w + (has ? a : b);
}
const paras = (t) => String(t || "").split(/\n{2,}|\r\n\r\n/).map((p) => p.trim()).filter(Boolean);
const summaryOf = (a) => a.lead || paras(a.body)[0] || [a.when, a.where].filter(Boolean).join(" · ");
const visible = (list) => list.filter((a) => a.status === "published" || (isEditor() && a.status === "draft"));
const order = (list) => [...list].sort((a, b) => (!!b.featured - !!a.featured) || a.createdAt - b.createdAt);

let settingsCache;
async function settings() {
  if (!settingsCache) settingsCache = await store.settings().catch(() => ({ groups: DEFAULT_GROUPS }));
  if (!settingsCache.groups?.length) settingsCache.groups = DEFAULT_GROUPS;
  return settingsCache;
}
let issuesCache;
async function allIssues(force) {
  if (!issuesCache || force) issuesCache = await store.issues();
  return issuesCache;
}
const publicIssues = (list) => list.filter((i) => i.count > 0 || isEditor());

/* ── 아이콘 ── */
const I = {
  kakao: `<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>`,
  mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`,
  link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>`,
  play: `<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="11" fill="#e0405e"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>`,
};
const shareButtons = (kind) => `
  <div class="share">
    <button class="sbtn kakao" data-share="kakao">${I.kakao}카카오톡으로 보내기</button>
    <button class="sbtn mail" data-share="mail">${I.mail}${kind === "issue" ? "이메일 소식지 만들기" : "이메일로 보내기"}</button>
    <button class="sbtn" data-share="link">${I.link}링크 복사</button>
  </div>`;

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove(); return ok;
  }
}
async function shareKakao({ title, text, url }) {
  const touch = matchMedia("(pointer: coarse)").matches;
  if (navigator.share && touch) {
    try { await navigator.share({ title, text, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  await copyText(`${title}\n${text ? text + "\n" : ""}${url}`);
  toast("복사했어요. 카카오톡 대화방에 붙여넣어 주세요.");
}
function mailto(subject, body, to = "") {
  location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

/* ── 공통 조각 ── */
function card(a, groups, { feature = false, showIssue = false } = {}) {
  const kind = a.section === "group" ? "c-group" : "c-event";
  const tag = a.section === "group" ? (a.group || "선교 그룹") : "전체 행사";
  const img = a.coverThumb
    ? `<div class="ph"><img src="${esc(a.coverThumb)}" alt="" loading="lazy"></div>`
    : `<div class="ph none">SCIC</div>`;
  const when = [showIssue ? issueLabel(a.issue) : "", a.when].filter(Boolean).join(" · ");
  return `<a class="card ${kind} ${feature ? "feature" : ""}" href="#/a/${esc(a.id)}">
    ${img}
    <div class="tx">
      <div class="row" style="gap:6px"><span class="chip">${esc(tag)}</span>${a.status === "draft" ? `<span class="chip draft">임시 저장</span>` : ""}</div>
      <h3>${esc(a.title)}</h3>
      <p>${esc(summaryOf(a))}</p>
      ${when ? `<div class="when">${esc(when)}</div>` : ""}
    </div>
  </a>`;
}
function setMenu(k) { $$("#menu a").forEach((a) => a.classList.toggle("on", a.dataset.k === k)); }
function byMonth(list) {
  const m = {};
  for (const a of list) (m[a.issue] ||= []).push(a);
  return Object.entries(m).sort((a, b) => b[0].localeCompare(a[0]));
}

/* ── 화면: 한 달 소식 ── */
async function viewIssue(id) {
  setMenu(id ? "" : "home");
  const [issues, groups] = [publicIssues(await allIssues()), (await settings()).groups];
  if (!id) id = issues[0]?.id;
  if (!id) {
    app.innerHTML = `<div class="wrap narrow"><div class="phead"><div class="eyebrow">SCIC 월간 소식</div><h1>아직 올라온 소식이 없어요</h1><p>첫 소식이 올라오면 이곳에 달마다 모입니다.</p></div></div>`;
    return;
  }
  const [issue, list] = await Promise.all([store.issue(id), store.articlesWhere("issue", id)]);
  const arts = order(visible(list));
  const events = arts.filter((a) => a.section === "event");
  const gr = arts.filter((a) => a.section === "group")
    .sort((a, b) => groups.indexOf(a.group) - groups.indexOf(b.group) || a.createdAt - b.createdAt);
  const ids = issues.map((i) => i.id);
  const idx = ids.indexOf(id);
  const newer = ids[idx - 1], older = ids[idx + 1];
  const cover = issue?.coverThumb || arts.find((a) => a.coverThumb)?.coverThumb;

  app.innerHTML = `
    <section class="mast">
      <div class="wrap">
        <div>
          <div class="eyebrow">SCIC 월간 소식</div>
          <h1>${issueLabel(id)}</h1>
          ${issue?.headline ? `<p class="headline">${esc(issue.headline)}</p>` : ""}
          ${issue?.intro ? `<p class="intro">${esc(issue.intro)}</p>` : `<p class="intro">전체 행사 소식 ${events.length}편, 선교 그룹 소식 ${gr.length}편을 담았습니다.</p>`}
          ${shareButtons("issue")}
          <div class="issue-nav">
            ${older ? `<a href="#/issue/${older}">‹ ${issueLabel(older)}</a>` : `<span>‹ 이전 호</span>`}
            ${newer ? `<a href="#/issue/${newer}">${issueLabel(newer)} ›</a>` : `<span>다음 호 ›</span>`}
            <a href="#/archive">지난 소식 모두 보기</a>
          </div>
        </div>
        ${cover ? `<div class="cover"><img src="${esc(cover)}" alt=""></div>` : ""}
      </div>
    </section>
    <div class="wrap">
      <section class="block c-event">
        <div class="block-head"><h2><i></i>전체 행사 소식</h2><a href="#/events">모두 보기 ›</a></div>
        ${events.length ? `<div class="grid ${events.length === 2 ? "two" : ""}">${events.map((a, i) => card(a, groups, { feature: i === 0 && events.length !== 2 })).join("")}</div>` : `<div class="empty">이달의 전체 행사 소식이 아직 없어요.</div>`}
      </section>
      <section class="block c-group">
        <div class="block-head"><h2><i></i>선교 그룹 소식</h2><a href="#/groups">그룹별로 보기 ›</a></div>
        ${gr.length ? `<div class="grid">${gr.map((a) => card(a, groups)).join("")}</div>` : `<div class="empty">이달의 선교 그룹 소식이 아직 없어요.</div>`}
      </section>
      ${isEditor() ? `<div class="more row"><a class="btn peri" href="#/admin?m=${id}">이 달 편집하기</a></div>` : ""}
    </div>`;

  const title = `SCIC 월간 소식 ${issueLabel(id)}`;
  const url = pageUrl(`#/issue/${id}`);
  const titles = arts.slice(0, 5).map((a) => `· ${a.title}`).join("\n");
  wireShare({
    kakao: () => shareKakao({ title, text: (issue?.headline ? issue.headline + "\n" : "") + titles, url }),
    mail: () => mailModal(id, issue, arts, groups),
    link: async () => { await copyText(url); toast("링크를 복사했어요."); },
  });
}
function wireShare(h) {
  $$("[data-share]").forEach((b) => b.onclick = () => h[b.dataset.share]?.());
}

/* ── 이메일 소식지 ── */
function emailHtml(id, issue, arts, groups) {
  const url = pageUrl(`#/issue/${id}`);
  const logo = new URL("logo-scic.png", location.href).href;
  const item = (a) => {
    const href = pageUrl(`#/a/${a.id}`);
    const tag = a.section === "group" ? a.group : "전체 행사";
    const color = a.section === "group" ? "#4a559c" : "#b4415f";
    return `<tr><td style="padding:0 0 22px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e9e6ee;border-radius:14px;border-collapse:separate">
        <tr>
          ${/^https?:/.test(a.coverThumb || "") ? `<td width="180" valign="top" style="padding:14px 0 14px 14px"><a href="${href}"><img src="${a.coverThumb}" width="180" alt="" style="display:block;width:180px;height:auto;border-radius:10px"></a></td>` : ""}
          <td valign="top" style="padding:14px 16px;border-left:4px solid ${color};border-radius:14px 0 0 14px;font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif">
            <div style="font-size:12px;font-weight:700;color:${color};margin-bottom:4px">${esc(tag)}</div>
            <a href="${href}" style="font-size:17px;font-weight:700;color:#2c2f45;text-decoration:none;line-height:1.45">${esc(a.title)}</a>
            <div style="font-size:14px;color:#676b82;line-height:1.6;margin-top:6px">${esc(summaryOf(a))}</div>
            ${a.when || a.where ? `<div style="font-size:12px;color:#9a9db0;margin-top:6px">${esc([a.when, a.where].filter(Boolean).join(" · "))}</div>` : ""}
          </td>
        </tr>
      </table>
    </td></tr>`;
  };
  const sec = (name, list, color) => list.length ? `
    <tr><td style="padding:18px 0 12px;font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;font-size:19px;font-weight:800;color:#2c2f45;border-bottom:2px solid #2c2f45">
      <span style="color:${color}">●</span> ${name}</td></tr>
    <tr><td style="height:14px"></td></tr>
    ${list.map(item).join("")}` : "";
  const events = arts.filter((a) => a.section === "event");
  const gr = arts.filter((a) => a.section === "group");
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f3f6"><tr><td align="center" style="padding:24px 12px">
  <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;width:100%">
    <tr><td style="background:#ffffff;border-radius:18px 18px 0 0;padding:26px 28px 8px"><img src="${logo}" height="28" alt="SCIC" style="display:block;height:28px;width:auto"></td></tr>
    <tr><td style="background:#ffffff;padding:6px 28px 26px;font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;border-bottom:1px solid #e9e6ee">
      <div style="font-size:12px;letter-spacing:2px;font-weight:800;color:#d4506f">SCIC 월간 소식</div>
      <div style="font-size:30px;font-weight:800;color:#2c2f45;margin:6px 0 4px">${issueLabel(id)}</div>
      ${issue?.headline ? `<div style="font-size:17px;color:#4a559c;margin-bottom:10px">${esc(issue.headline)}</div>` : ""}
      ${issue?.intro ? `<div style="font-size:15px;color:#676b82;line-height:1.7;white-space:pre-wrap">${esc(issue.intro)}</div>` : ""}
    </td></tr>
    <tr><td style="background:#faf8f6;padding:10px 28px 10px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        ${sec("전체 행사 소식", events, "#d4506f")}
        ${sec("선교 그룹 소식", gr, "#5b67b3")}
      </table>
    </td></tr>
    <tr><td align="center" style="background:#ffffff;border-radius:0 0 18px 18px;padding:24px 28px 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif">
      <a href="${url}" style="display:inline-block;background:#d4506f;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:12px;font-size:15px">사진·영상·인터뷰까지 웹에서 보기</a>
      <div style="font-size:12px;color:#9a9db0;margin-top:16px">사랑의교회 SCIC 동문회 · 일터에서 의미와 가치를 찾는 사람들</div>
    </td></tr>
  </table></td></tr></table>`;
}
function emailText(id, issue, arts) {
  const lines = [`SCIC 월간 소식 ${issueLabel(id)}`, issue?.headline || "", ""];
  const add = (name, list) => {
    if (!list.length) return;
    lines.push(`■ ${name}`);
    list.forEach((a) => lines.push(`- ${a.section === "group" ? `[${a.group}] ` : ""}${a.title}`));
    lines.push("");
  };
  add("전체 행사 소식", arts.filter((a) => a.section === "event"));
  add("선교 그룹 소식", arts.filter((a) => a.section === "group"));
  lines.push("사진·영상·인터뷰까지 보기:", pageUrl(`#/issue/${id}`));
  return lines.filter((l, i) => l || lines[i - 1]).join("\n");
}
function modal(html) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("click", (e) => { if (e.target === m || e.target.closest("[data-close]")) m.remove(); });
  document.addEventListener("keydown", function k(e) { if (e.key === "Escape") { m.remove(); document.removeEventListener("keydown", k); } });
  document.body.appendChild(m);
  return m;
}
function mailModal(id, issue, arts, groups) {
  const pub = arts.filter((a) => a.status === "published");
  const html = emailHtml(id, issue, pub, groups);
  const text = emailText(id, issue, pub);
  const m = modal(`
    <h2>이메일 소식지 · ${issueLabel(id)}</h2>
    <p class="hint">① <b>편지 모양 복사</b>를 누르고 ② 메일(지메일·네이버 메일 등) 쓰기 창 본문에 붙여넣으세요. 받는 사람은 '숨은참조'에 넣으면 서로의 주소가 보이지 않아요.</p>
    <div class="row">
      <button class="btn" id="copyRich">편지 모양 복사</button>
      <button class="btn line" id="openMail">메일 앱에서 글자로 보내기</button>
      <span class="spacer"></span>
      <button class="btn ghost" data-close>닫기</button>
    </div>
    <div class="mail-prev" id="mailPrev">${html}</div>`);
  $("#copyRich", m).onclick = async () => {
    try {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([text], { type: "text/plain" }),
      })]);
    } catch {
      const r = document.createRange(); r.selectNodeContents($("#mailPrev", m));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); s.removeAllRanges();
    }
    toast("복사했어요. 메일 쓰기 창 본문에 붙여넣으세요.");
  };
  $("#openMail", m).onclick = () => mailto(`[SCIC 월간 소식] ${issueLabel(id)}`, text);
}

/* ── 화면: 전체 행사 / 그룹 모아 보기 ── */
async function viewList(kind, group) {
  setMenu(kind === "event" ? "events" : "groups");
  const groups = (await settings()).groups;
  const list = order(visible(kind === "event" ? await store.articlesWhere("section", "event") : await store.articlesWhere("group", group)));
  const cls = kind === "event" ? "c-event" : "c-group";
  const title = kind === "event" ? "전체 행사 소식" : group;
  const desc = kind === "event" ? "동문회 전체가 함께한 행사를 달마다 모았습니다." : "이 선교 그룹의 활동을 달마다 모았습니다.";
  app.innerHTML = `
    <div class="wrap ${cls}">

function videoHtml(u) {
  const m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="영상" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`;
  const v = u.match(/vimeo\.com\/(\d+)/);
  if (v) return `<div class="video"><iframe src="https://player.vimeo.com/video/${v[1]}" title="영상" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  if (!/^https?:\/\//.test(u)) return "";
  return `<a class="vlink" href="${esc(u)}" target="_blank" rel="noopener">${I.play}<span>영상 보러 가기</span></a>`;
}
function interviewHtml(iv) {

    if (photos.length === 1) { const im = $("#photos img"); if (im) im.src = photos[0].data || photos[0].thumb; }
    $$("#photos [data-i]").forEach((b) => b.onclick = () => lightbox(photos, +b.dataset.i));

}
function lightbox(photos, i) {
  const m = document.createElement("div");
  m.className = "lb";
  const draw = () => {
    const p = photos[i];
    m.innerHTML = `<img src="${esc(p.data || p.thumb)}" alt="${esc(p.caption)}">${p.caption ? `<p>${esc(p.caption)}</p>` : ""}<p style="opacity:.6;font-size:.85rem">${i + 1} / ${photos.length}</p>
      <button class="x" aria-label="닫기">✕</button>${photos.length > 1 ? `<button class="pv" aria-label="이전">‹</button><button class="nx" aria-label="다음">›</button>` : ""}`;
  };
  const close = () => { m.remove(); document.removeEventListener("keydown", key); };
  const move = (d) => { i = (i + d + photos.length) % photos.length; draw(); };
  const key = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowLeft") move(-1); if (e.key === "ArrowRight") move(1); };
  m.addEventListener("click", (e) => {
    if (e.target.closest(".x") || e.target === m) close();
    else if (e.target.closest(".pv")) move(-1);
    else if (e.target.closest(".nx")) move(1);
  });
  let sx = null;
  m.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  m.addEventListener("touchend", (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) move(dx < 0 ? 1 : -1); sx = null; });
  document.addEventListener("keydown", key);
  draw(); document.body.appendChild(m);
}

async function wireEditors() {
  let v;
  const draw = () => {
    const rows = [...v.admins.map((e) => [e, "admins"]), ...v.editors.filter((e) => !v.admins.includes(e)).map((e) => [e, "editors"])];
    $("#edList").innerHTML = rows.length ? rows.map(([e, k]) => `<div class="adm-item"><div class="t"><b>${esc(e)}</b><span>${k === "admins" ? "관리자" : "편집자"}${e === me.email ? " · 나" : ""}</span></div>
      <button class="btn ghost sm" type="button" data-rmed="${esc(e)}" style="color:#b3261e">빼기</button></div>`).join("")
      : `<div class="empty" style="padding:18px">아직 등록한 사람이 없어요. 아래에 이메일을 넣어 추가하세요.</div>`;
    $$("[data-rmed]").forEach((b) => b.onclick = () => {
      const e = b.dataset.rmed;
      if (e === me.email && !confirm("내 계정을 빼면 편집실에 다시 못 들어올 수 있어요. 뺄까요?")) return;
      if (e !== me.email && !confirm(`${e} 계정을 뺄까요?`)) return;
      save({ admins: v.admins.filter((x) => x !== e), editors: v.editors.filter((x) => x !== e) }, "뺐어요.");
    });
  };
  const save = async (next, msg) => {
    try { await store.saveEditors(next); v = await store.editors(); draw(); toast(msg); }
    catch (err) { fail(err); }
  };
  try { v = await store.editors(); draw(); } catch (err) { fail(err); return; }
  $("#edForm").onsubmit = (e) => {
    e.preventDefault();
    const email = $("#edEmail").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("이메일을 바르게 적어 주세요.");
    const k = $("#edRole").value;

    next[k] = [...next[k], email];

    save(next, `${email} 계정을 ${k === "admins" ? "관리자" : "편집자"}로 등록했어요.`);
  };
}

/* 사진 줄이기: 원본은 1600px 안쪽, 목록용 작은 사진은 따로 */
function loadImage(src) {
  return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
}
function toJpeg(im, max, q) {
  const w0 = im.naturalWidth || im.width, h0 = im.naturalHeight || im.height;
  const r = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * r); c.height = Math.round(h0 * r);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(im, 0, 0, c.width, c.height);
  return { url: c.toDataURL("image/jpeg", q), w: c.width, h: c.height };
}
async function compress(file) {
  const src = URL.createObjectURL(file);
  try {
    const im = await loadImage(src);
    let main;
    for (const [max, q] of [[1600, 0.82], [1400, 0.75], [1200, 0.7], [1000, 0.65]]) {
      main = toJpeg(im, max, q);
      if (main.url.length < 800000) break;
    }
    return { data: main.url, w: main.w, h: main.h, thumb: toJpeg(im, 520, 0.72).url };
  } finally { URL.revokeObjectURL(src); }
}
async function coverFrom(p) {
  const im = await loadImage(p.data || p.thumb);
  return toJpeg(im, 900, 0.74).url;
}

      await refreshIssue(origIssue);
      issuesCache = null; toast("소식을 지웠어요."); location.hash = `#/admin?m=${origIssue}`;
    } catch (err) { fail(err); }
  });
}

/* ── 길 찾기 ── */
async function route() {
  const h = decodeURIComponent(location.hash.slice(1) || "/");
  const [path, qs] = h.split("?");
  const p = path.split("/").filter(Boolean);
  const params = new URLSearchParams(qs || "");
  started = true;
  await firstAuth;
  $("#admLink").hidden = !isEditor();
  window.scrollTo(0, 0);
  try {
    if (!p.length) await viewIssue();
    else if (p[0] === "issue" && /^\d{4}-\d{2}$/.test(p[1])) await viewIssue(p[1]);
    else if (p[0] === "events") await viewList("event");
    else if (p[0] === "groups") await viewGroups();
    else if (p[0] === "group") await viewList("group", p.slice(1).join("/"));
    else if (p[0] === "archive") await viewArchive();
    else if (p[0] === "a") await viewArticle(p[1]);
    else if (p[0] === "admin") await viewAdmin(params);
    else if (p[0] === "edit") await viewEdit(p[1]);
    else if (p[0] === "new") await viewEdit(null, p[1]);
    else await viewIssue();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="wrap narrow"><div class="phead"><h1>잠시 연결이 안 돼요</h1><p>조금 뒤에 다시 열어 주세요.</p></div></div>`;
  }
}
let authed = false;
store.onAuth(async (u) => {
  let role = "";
  if (u) { try { role = await store.role(); } catch (e) { console.error(e); } }
  const changed = (me?.email || "") !== (u?.email || "") || (me?.role || "") !== role;
  me = u ? { ...u, role } : null;
  issuesCache = null;
  if (!authed) { authed = true; authReady(); return; }
  if (changed) route();
});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
